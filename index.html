<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetris</title>
  <script>
    // Aplica el tema antes del primer render para evitar un parpadeo.
    (function () {
      var theme = null;
      try { theme = localStorage.getItem('tetris-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
      }
      document.documentElement.dataset.theme = theme;
    })();
  </script>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrapper">
    <div class="game-container">
      <canvas id="board" width="300" height="600"></canvas>

      <aside class="panel">
        <div class="panel-section">
          <span class="label">SCORE</span>
          <span class="value" id="score">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LINES</span>
          <span class="value" id="lines">0</span>
        </div>
        <div class="panel-section">
          <span class="label">LEVEL</span>
          <span class="value" id="level">1</span>
        </div>

        <div class="panel-section">
          <span class="label">NEXT</span>
          <canvas id="next-canvas" width="120" height="120"></canvas>
        </div>

        <div class="panel-section controls">
          <span class="label">CONTROLS</span>
          <ul>
            <li><kbd>←</kbd><kbd>→</kbd> mover</li>
            <li><kbd>↑</kbd> rotar</li>
            <li><kbd>↓</kbd> bajar</li>
            <li><kbd>Space</kbd> caída</li>
            <li><kbd>P</kbd><kbd>Esc</kbd> pausa</li>
          </ul>
        </div>

        <button id="theme-btn" type="button">Modo claro</button>
      </aside>
    </div>

    <div id="overlay" class="overlay hidden">
      <div class="overlay-box">
        <p id="overlay-title">GAME OVER</p>
        <p id="overlay-score"></p>

        <div id="menu-main" class="menu">
          <button id="resume-btn" class="primary" type="button">Reanudar</button>
          <button id="restart-btn" type="button">Reiniciar</button>
          <button id="controls-btn" type="button">Ver controles</button>
          <button id="level-btn" type="button">Nivel inicial: 1</button>
        </div>

        <div id="menu-controls" class="menu hidden">
          <ul class="menu-keys">
            <li><span><kbd>←</kbd><kbd>→</kbd></span>Mover</li>
            <li><span><kbd>↑</kbd><kbd>X</kbd></span>Rotar</li>
            <li><span><kbd>↓</kbd></span>Bajar</li>
            <li><span><kbd>Space</kbd></span>Caída</li>
            <li><span><kbd>P</kbd><kbd>Esc</kbd></span>Pausa</li>
          </ul>
          <p class="menu-hint"><kbd>↑</kbd><kbd>↓</kbd> navegar · <kbd>Enter</kbd> elegir · <kbd>Esc</kbd> volver</p>
          <button id="back-btn" type="button">Volver</button>
        </div>
      </div>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
